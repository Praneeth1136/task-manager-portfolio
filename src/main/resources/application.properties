# Server Configuration
server.port=1111

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskmanager_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:bhaNu1136@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Data SQL loading
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
# Ignore errors if data already exists or data.sql fails
spring.sql.init.continue-on-error=true

# JWT Configuration
jwt.secret=${JWT_SECRET:praneeth1136_secret_key_make_it_very_long_2026}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.praneeth.taskmanager=DEBUG
